services:
  mysql:
    image: mysql:8.4
    container_name: localeflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: DevPassword123!
      MYSQL_DATABASE: localeflow_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: localeflow-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: